[project]
name = "notebookgpt-ui"
version = "1.0.0"
description = "Interface Flet do NotebookGPT: um workspace escuro para conversas e anotacoes."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "André Galindo Alves de Queiroz", email = "5283204+agaqueiroz@users.noreply.github.com" }
]
dependencies = [
    "notebookgpt-core",
    "notebookgpt-index",
    "notebookgpt-inference",
    "flet>=0.86",
    "python-dotenv>=1.0",
]

[project.scripts]
notebookgpt = "notebookgpt_ui.app:run"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "notebookgpt_ui"

# Metadados lidos por `flet build`. O empacotamento em si ainda nao esta ligado
# ao layout do monorepo: `flet build` espera achar o modulo de entrada na raiz do
# diretorio do app (tool.flet.app.path + tool.flet.app.module) e instalar as
# dependencias do proprio pyproject, o que nao alcanca os membros do workspace.
# Por enquanto o caminho suportado e `uv run notebookgpt`; ver TODO.md.
[tool.flet]
org = "dev.flet"
company = "André Queiroz"
copyright = "Copyright (C) 2026 by André Queiroz"

[tool.flet.metadata]
title = "NotebookGPT"
