[project]
name = "notebookgpt-core"
version = "1.0.0"
description = "Dominio do NotebookGPT: caderno, fontes TXT, persistencia e montagem de contexto."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "André Galindo Alves de Queiroz", email = "5283204+agaqueiroz@users.noreply.github.com" }
]
# Somente biblioteca padrao: e o que permite testar o dominio sem Flet e sem rede.
dependencies = []

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "notebookgpt_core"
